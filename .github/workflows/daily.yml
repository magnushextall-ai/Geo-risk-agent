name: Daily risk scan

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch and classify today's news
        run: python agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save results
        run: |
          git config user.name "risk-agent-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add risk.db index.html
          git commit -m "Daily risk scan $(date -u +%F)" || echo "Nothing new"
          git push
